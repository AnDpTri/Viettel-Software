services:
  - type: web
    name: so-moc-finance
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: so-moc-finance-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: "15"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: local

databases:
  - name: so-moc-finance-db
    plan: free
    region: singapore
    databaseName: personal_finance
    user: finance
    postgresMajorVersion: "17"
