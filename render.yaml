services:
  - type: web
    name: so-moc-finance
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: so-moc-finance-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: '15'
      - key: MAX_UPLOAD_MB
        value: '5'
      - key: COOKIE_SECURE
        value: 'true'
      # Tài khoản dùng thử cho người đánh giá: demo / Demo@123 (VIP), tạo lại mỗi lần khởi động, không đổi mật khẩu hay xóa được.
      - key: SEED_DEMO
        value: 'true'
      # Render free chặn cổng SMTP, nên gửi email qua API HTTPS của Brevo. Điền khóa API và email người gửi đã xác minh trên Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_REQUEST_TIMEOUT_MS
        value: '30000'
      - key: AI_DAILY_LIMIT
        value: '30'
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: '6'
      - key: AI_IMAGE_MAX_MB
        value: '5'
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash

databases:
  - name: so-moc-finance-db
    plan: free
    region: singapore
    databaseName: personal_finance
    user: finance
    postgresMajorVersion: '17'
