name: CI

on:
  push:
    branches: [main, 'codex/cloud-completion-*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      # Unit/API test chạy trên schema riêng, được tạo lại sạch mỗi lần chạy.
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=vitest
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run migrate:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:web
      - run: npm run test:agent-batch
      - run: npm audit --audit-level=high
      - name: Start API
        run: |
          npm start > /tmp/finance-api.log 2>&1 &
          for i in {1..30}; do curl --fail http://localhost:3000/ready && exit 0; sleep 1; done
          cat /tmp/finance-api.log
          exit 1
      - run: npm run test:e2e
      - run: npm run test:agent
      - run: npm run test:ui
        env:
          EDGE_PATH: /usr/bin/google-chrome
      - run: docker build -t personal-finance-api:ci .
      - name: Container readiness and graceful shutdown
        run: |
          docker run -d --name finance-ci-smoke --network host \
            -e DATABASE_URL -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET \
            -e PORT=3032 -e APP_URL=http://127.0.0.1:3032 -e SEED_DEMO=false \
            personal-finance-api:ci
          trap 'docker logs finance-ci-smoke; docker rm -f finance-ci-smoke >/dev/null 2>&1 || true' EXIT
          ready=false
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3032/ready; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl --fail http://127.0.0.1:3032/health
          docker stop --time 15 finance-ci-smoke
          test "$(docker inspect --format='{{.State.ExitCode}}' finance-ci-smoke)" = 0
