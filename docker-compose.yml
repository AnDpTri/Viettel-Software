services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://finance:finance_secret@db:5432/personal_finance?schema=public
      JWT_ACCESS_SECRET: docker-access-secret-change-in-production-123456
      JWT_REFRESH_SECRET: docker-refresh-secret-change-in-production-123456
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      RESET_TOKEN_EXPIRES_MINUTES: 15
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      MAX_UPLOAD_MB: 5
      COOKIE_SECURE: "false"
      AI_PROVIDER: local
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
