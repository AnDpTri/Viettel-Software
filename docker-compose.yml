services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Hộp thư demo: nhận mọi email hệ thống gửi (quên mật khẩu, xác minh email). Xem tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://finance:finance_secret@db:5432/personal_finance?schema=public
      JWT_ACCESS_SECRET: docker-access-secret-change-in-production-123456
      JWT_REFRESH_SECRET: docker-refresh-secret-change-in-production-123456
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      RESET_TOKEN_EXPIRES_MINUTES: 15
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      MAX_UPLOAD_MB: 5
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@so-moc.local
      # Bản demo: ghi SMS OTP ra log container (xem bằng: docker compose logs api). Khi triển khai thật, thay bằng nhà cung cấp SMS.
      SMS_PROVIDER: console
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-30000}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-6}
      AI_IMAGE_MAX_MB: ${AI_IMAGE_MAX_MB:-5}
      LOG_HTTP_DETAILS: "true"
      # Tùy chọn: thiếu khóa thì ứng dụng vẫn chạy đầy đủ, chỉ Trợ lý AI báo chưa cấu hình.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
